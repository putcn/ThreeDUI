<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlassUI · Playground</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d9d4d2; overflow: hidden; }
    canvas { display: block; }
    canvas:focus { outline: none; }
    canvas:focus-visible { outline: 2px solid rgba(107, 99, 245, 0.4); outline-offset: -2px; }
    #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 -apple-system, system-ui, sans-serif; color: #333; opacity: .7; pointer-events: none; }
    #hud.error { right: 12px; color: #b00020; opacity: 1; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="hud" class="hud"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
